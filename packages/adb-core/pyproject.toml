[project]
name = "adb-core"
version = "0.1.0"
description = "anki-deck-builder - run state, phase gates, artifact validation, work subsets and the corpus digest"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5",
    "jinja2>=3.1.6",
    "jsonschema>=4.26",
    "markupsafe>=3.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
