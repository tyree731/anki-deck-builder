[project]
name = "adb-testkit"
version = "0.1.0"
description = "anki-deck-builder - shared test fixtures and sample data for every workspace member (dev only)"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5",
    "pytest>=9.1",
    "pillow>=13.0",
    "adb-core",
    "adb-deck",
]

[tool.uv.sources]
adb-core = { workspace = true }
adb-deck = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
